<head>

    <title>Day View</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'app/calendar/day.js' %}"></script>
</head>

<body>
    <div id="selectedDate" data-date="{{ selected_date }}"></div>

    <div class="outer relative shadow-lg bg-white rounded-md transition-all">
        <div class="flex">
            <!-- Time column -->
            <div class="w-20 bg-white flex flex-col z-10 time-column border-r border-gray-200">
                <!-- Time labels injected by JS -->
            </div>

            <!-- Day column -->
            <div class="w-full relative">
                <!-- Header -->
                <div
                    class="h-[60px] bg-gray-100 border-b border-gray-300 flex items-center justify-center text-sm font-medium day-header">
                    {{ selected_date }}
                </div>

                <!-- Event grid -->
                <div class="day-grid relative" style="height: 1440px;">
                    <!-- Events injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            const startHour = 0;
            const endHour = 23;
            const today = new Date();
            const dayName = today.toLocaleDateString('en-US', { weekday: 'short' });
            const dayDate = `${today.getDate()}/${today.getMonth() + 1}`;

            // ----- Time Column -----
            const $timeColumn = $('.time-column');
            $timeColumn.append($('<div>', { class: 'h-[60px]' })); // empty top header
            for (let h = startHour; h <= endHour; h++) {
                const period = h >= 12 ? 'PM' : 'AM';
                const hour = h === 0 ? 12 : (h > 12 ? h - 12 : h);
                $timeColumn.append(
                    $('<div>', {
                        class: 'h-[60px] text-right pr-2 text-xs text-gray-500 pt-1',
                        text: `${hour} ${period}`
                    })
                );
            }

            // ----- Header (Day Name + Date) -----
            $('.day-header').html(`
                <div>
                    <div>${dayName}</div>
                    <div class="text-xs text-gray-500">${dayDate}</div>
                </div>
            `);

            // ----- Grid Lines -----
            const $dayGrid = $('.day-grid');
            for (let h = 0; h <= endHour; h++) {
                $dayGrid.append($('<div>', {
                    class: 'h-[60px] border-t border-dotted border-gray-300'
                }));
            }

            // ----- Fetch and Render Events -----
            function getEvents() {
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const currentDate = `${year}-${month}-${day}`;

                $.ajax({
                    type: "GET",
                    url: "api/calendar/filter_note/",
                    data: {
                        start_date: currentDate,
                        end_date: currentDate
                    },
                    success: function (response) {
                        displayEvents(response);
                    },
                    error: function (xhr, status, error) {
                        console.error(error);
                    }
                });
            }

            function displayEvents(events) {
                $(".day-grid").find(".event-box").remove();

                const gap = 6;
                const paddingX = 12;
                const containerWidth = $(".day-grid").width() - paddingX * 2;

                const parsed = parseAndSort(events);
                const clusters = groupOverlapping(parsed);

                clusters.forEach(cluster => renderCluster(cluster, containerWidth, paddingX, gap));
            }

            function parseAndSort(events) {
                return events.map((e, i) => {
                    const toHour = time => {
                        const [h, m] = time.split(":").map(Number);
                        return h + m / 60;
                    };
                    return { ...e, id: i, start: toHour(e.start_time), end: toHour(e.end_time) };
                }).sort((a, b) => a.start - b.start);
            }

            function groupOverlapping(events) {
                const clusters = [];
                let current = [];

                events.forEach(event => {
                    const lastEnd = Math.max(...current.map(e => e.end), -Infinity);
                    if (event.start < lastEnd) {
                        current.push(event);
                    } else {
                        if (current.length) clusters.push(current);
                        current = [event];
                    }
                });
                if (current.length) clusters.push(current);
                return clusters;
            }

            function renderCluster(cluster, containerWidth, paddingX, gap) {
                const cols = cluster.length;
                const totalGap = (cols - 1) * gap;
                const colWidth = (containerWidth - totalGap) / cols;

                cluster.forEach((event, i) => {
                    const top = event.start * 60;
                    const height = Math.max((event.end - event.start) * 60, 30);
                    const left = paddingX + i * (colWidth + gap);

                    const $event = $(`
                <div class="event-box absolute bg-blue-500 text-white p-2 rounded-md shadow-md text-[13px] leading-tight"
                     style="top: ${top}px; height: ${height}px; left: ${left}px; width: ${colWidth}px;">
                    <p class="font-bold">${event.note_title}</p>
                </div>
            `);

                    $(".day-grid").append($event);
                });
            }

            getEvents();
        });
