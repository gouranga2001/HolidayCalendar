{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'app/calendar/calendar.js' %}"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body>
    <body class="bg-gray-100 text-white">

    <div class="container mx-auto p-4">
        <!-- Calendar Header -->
        <div class="flex justify-between items-center p- rounded-md">
            <button id="prevMonth" class="text-gray-400 hover:bg-gray-700 p-2 rounded">◀</button>
            <span id="calendarMonth" class="text-xl"></span>
            <span id="calendarYear" class="text-xl text-red-500"></span>
            <button id="nextMonth" class="text-gray-400 hover:bg-gray-700 p-2 rounded">▶</button>
        </div>

        <!-- Calendar Grid -->
        <div class="grid grid-cols-7 gap-1">
            <div class="text-center font-semibold">Mo</div>
            <div class="text-center font-semibold">Tu</div>
            <div class="text-center font-semibold">We</div>
            <div class="text-center font-semibold">Th</div>
            <div class="text-center font-semibold">Fr</div>
            <div class="text-center font-semibold">Sa</div>
            <div class="text-center font-semibold">Su</div>
        </div>

        <!-- Calendar Days -->
        <div id="calendarDays" class="grid grid-cols-7 gap-1 mt-1"></div>
    </div>

    <script src="{% static 'app/calendar/calendar.js' %}"></script>
</body>
</html>
