{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'app/calendar/day.js' %}"></script>
    <!-- <script src="{% static 'app/calendar/week.js' %}"></script> -->
    <script src="{% static 'app/calendar/calendar.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
</head>
<body>
    <body class=" text-white">

    <div class="container mx-auto p-4">
        <!-- Calendar Header -->
        <div class="flex justify-around items-center rounded-md ">
            
            <span id="calendarMonth" class="text-xl"></span>
            <span id="calendarYear" class="text-xl text-red-500"></span>
            <div class="flex items-center flex-shrink-0">
            <button id="prevMonth" class=" p-2 cursor-pointer hover:bg-transparent"> <img src="{% static 'assets/previous.svg' %}" alt="Plus Icon" class="w-5 h-5 rounded stroke-white"></button>
            <button id="nextMonth" class="cursor-pointer p-2 hover:bg-transparent"> <img src="{% static 'assets/next.svg' %}" alt="Plus Icon" class="w-5 h-5 rounded stroke-white"></button>
            </div>
           
        </div>

        <!-- Calendar Grid -->
        <div class="grid grid-cols-7 gap-1">
            <div class="text-center font-semibold">Mo</div>
            <div class="text-center font-semibold">Tu</div>
            <div class="text-center font-semibold">We</div>
            <div class="text-center font-semibold">Th</div>
            <div class="text-center font-semibold">Fr</div>
            <div class="text-center font-semibold">Sa</div>
            <div class="text-center font-semibold">Su</div>
        </div>

        <!-- Calendar Days -->
        <div id="calendarDays" class="grid grid-cols-7 gap-1 mt-1"></div>
    </div>

    
</body>
</html>
