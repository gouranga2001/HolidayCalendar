{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toast</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <div id="toast" class="fixed top-20 right-4 z-50 shadow-lg max-w-xs 
         bg-red-100 border border-red-300 
         text-sm text-red-900 
         rounded-lg hidden" role="alert" tabindex="-1" aria-labelledby="toast-label">

        <div id="toast-label" class="flex items-center p-4">
            <!-- Message -->
            <span id="toast-message" class="pr-2"></span>

            <!-- Close Button -->
            <div class="ms-auto">
                <button type="button" class="inline-flex shrink-0 justify-center items-center size-5 
               rounded-lg text-red-800 opacity-50 hover:opacity-100 focus:outline-hidden focus:opacity-100"
                    aria-label="Close">
                    <span class="sr-only">Close</span>
                    <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18"></path>
                        <path d="m6 6 12 12"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>


</body>

</html>
