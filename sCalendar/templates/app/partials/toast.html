{% load static %}

<script src="https://code.jquery.com/jquery-3.7.1.min.js"integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<script src="{% static 'app/partials/toast.js' %}"></script>

<div id="toast" class="fixed top-20 right-4 z-50 shadow-lg max-w-xs bg-teal-100  border-teal-300 text-sm text-teal-900 rounded-lg dark:bg-teal-900/10 dark:border-teal-900 dark:text-teal-500 hidden" role="alert" tabindex="-1" aria-labelledby="hs-toast-soft-color-teal-label">
    <div id="hs-toast-soft-color-teal-label" class="flex p-4">
        <span id="toast-message"></span>
        <div class="ms-auto">
            <button type="button" class="inline-flex shrink-0 justify-center items-center size-5 rounded-lg text-teal-800 opacity-50 hover:opacity-100 focus:outline-hidden focus:opacity-100 dark:text-teal-200" aria-label="Close">
                <span class="sr-only">Close</span>
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="rgb(7, 177, 207)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                </svg>
            </button>
        </div>
    </div>
</div>
